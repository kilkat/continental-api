name: Inspect public Postman history

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query public revision endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          owner = "54600970"
          collection = "62f5e9dc-0019-4cf5-bf1b-78ba287412d2"
          folder = "707c3587-4a6e-457d-aa94-046c271e8ebd"
          wrapper = "77615abe-2a8e-4245-b8ee-4005c3d43db3"
          request_id = "e22d56b7-7787-4af1-b15f-737ba15c6e08"
          revision_ids = (49281173772, 49281190077, 49281191074, 51776954922, 51854625172)

          paths = [
              f"collection/revisions/{owner}-{collection}",
              f"folder/revisions/{owner}-{folder}",
              f"folder/revisions/{owner}-{wrapper}",
              f"request/revisions/{owner}-{request_id}",
              f"folder/{owner}-{folder}?changeset=true",
              f"folder/{owner}-{wrapper}?changeset=true",
              f"request/{owner}-{request_id}?changeset=true",
          ]
          for rev in revision_ids:
              paths.extend((
                  f"revision/{rev}",
                  f"revisions/{rev}",
                  f"collection/revision/{rev}",
                  f"collection/revisions/{owner}-{collection}/{rev}",
                  f"collection/{owner}-{collection}?revision={rev}&populate=true&changeset=true",
              ))

          for path in paths:
              url = "https://www.postman.com/_api/" + path
              req = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 (compatible; continental-ctf-history/1.0)",
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      body = response.read().decode("utf-8", "replace")
                      print(f"\n=== {response.status} {path} ===")
                      print(body[:30000])
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  print(f"\n=== {error.code} {path} ===")
                  print(body[:1000])
              except Exception as error:
                  print(f"\n=== ERROR {path}: {type(error).__name__}: {error} ===")
          PY
